<div class="p-4 md:p-6 max-w-7xl mx-auto">
  @if (loading()) {
    <app-ui-loading [show]="loading()" message="Loading anime..." size="medium" />
  }

  @if (!loading() && animes().length > 0) {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
      @for (anime of animes(); track anime.mal_id) {
        <app-anime-card [anime]="anime" [showRank]="true" [maxGenres]="2" />
      }
    </div>

    <app-ui-pagination
      [currentPage]="currentPage()"
      [hasNextPage]="hasNextPage()"
      (pageChanged)="changePage($event)"
    />
  }

  @if (error()) {
    <app-ui-error [message]="error()!" [showRetry]="true" (retry)="loadAnime()" />
  }

  @if (!loading() && !error() && animes().length === 0) {
    <div class="text-center py-16">
      <mat-icon class="text-gray-400 text-5xl mb-4">search_off</mat-icon>
      <p class="text-gray-600 dark:text-gray-400">No anime found.</p>
    </div>
  }
</div>
