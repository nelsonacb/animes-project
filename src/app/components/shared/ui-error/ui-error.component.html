<div class="text-center py-16">
  <!-- Ícono de error -->
  <mat-icon class="text-red-500 text-5xl mb-4" aria-hidden="true">
    {{ icon() }}
  </mat-icon>

  <!-- Título -->
  <h3 class="text-xl font-semibold mb-2" [class]="getAnimeUIErrorClasses()">
    Oops! Something went wrong
  </h3>

  <!-- Mensaje de error -->
  <p class="text-gray-600 dark:text-gray-400 mb-6">
    {{ message() }}
  </p>

  <!-- Botón de reintentar (opcional) -->
  @if (showRetry()) {
    <button
      mat-raised-button
      color="primary"
      (click)="onRetry()"
      class="flex items-center gap-2 mx-auto"
    >
      <mat-icon>refresh</mat-icon>
      {{ retryLabel() }}
    </button>
  }
</div>
