<div class="flex items-center gap-2">
  @if (showLabel) {
    <span class="text-sm text-gray-600 dark:text-gray-300 hidden sm:inline">
      {{ isDarkMode() ? 'Oscuro' : 'Claro' }}
    </span>
  }

  <mat-slide-toggle
    [checked]="isDarkMode()"
    (change)="onToggle()"
    color="primary"
    [class]="getSizeClasses()"
    aria-label="Cambiar tema claro/oscuro"
  >
    @if (showIcon) {
      <mat-icon class="scale-75">{{ getIcon() }}</mat-icon>
    }
  </mat-slide-toggle>

  <button
    mat-icon-button
    (click)="onToggle()"
    [attr.aria-label]="'Cambiar a modo ' + (isDarkMode() ? 'claro' : 'oscuro')"
    class="sm:hidden"
  >
    <mat-icon>{{ getIcon() }}</mat-icon>
  </button>
</div>
